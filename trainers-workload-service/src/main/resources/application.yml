server:
  port: 8082

spring:
  application:
    name: "trainers-workload-service"

  main:
    log-startup-info: false
  datasource:
    url: jdbc:h2:mem:gymcrmdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: admin
    password: admin
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

spring.web.resources:
  add-mappings: true
  static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
      hostname: localhost
      instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.cloud: DEBUG
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: AnotherSecuredSecretKeyForWorkloadService123456

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always