server:
  port: 8081

spring:
  application:
    name: "Workload Service"
  main:
    log-startup-info: false
  datasource:
    url: jdbc:h2:mem:gymcrmdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: admin
    password: admin
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
