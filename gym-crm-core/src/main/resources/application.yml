server:
  port: 8081

spring:
  application:
    name: "gym-crm-core"

  main:
    log-startup-info: false

  datasource:
    url: jdbc:postgresql://localhost:5432/gym_crm_db
    driver-class-name: org.postgresql.Driver
    username: gym
    password: gym

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hbm2ddl.auto: none

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    enabled: true
    contexts: dev
    drop-first: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    memory:
      threshold: 10485760
    disk:
      threshold: 1073741824
  prometheus:
    metrics:
      export:
        enabled: true

security:
  jwt:
    secret: SecuredSecretKeyThatIsLongEnough123456
    workload-service-secret: AnotherSecuredSecretKeyForWorkloadService123456

services:
  workload-service: "workload-service"
  discovery-service: "discovery-eureka-service"
  gateway-service: "api-gateway-service"

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      -
logging:
  level:
    org.springframework.boot.autoconfigure: WARN

workload:
  service-url: http://localhost:8081/api/v1/trainers-workload

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  circuitbreaker:
    instances:
      workoutServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        eventConsumerBufferSize: 10