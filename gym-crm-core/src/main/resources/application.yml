server:
  port: 8081

spring:
  application:
    name: "gym-crm-core"

  main:
    log-startup-info: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    enabled: true
    contexts: dev
    drop-first: false

  activemq:
    broker-url: ${BROKER_URL}
    user: ${BROKER_USER}
    password: ${BROKER_PASSWORD}
    packages:
      trust-all: true
  jms:
    client-id: workload-service
    listener:
      auto-startup: true
      session:
        acknowledge-mode: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    memory:
      threshold: 10485760
    disk:
      threshold: 1073741824
  prometheus:
    metrics:
      export:
        enabled: true

security:
  jwt:
    secret: SecuredSecretKeyThatIsLongEnough123456
    workloadServiceSecret: AnotherSecuredSecretKeyForWorkloadService123456

services:
  workload-service: "workload-service"
  discovery-service: "discovery-eureka-service"
  gateway-service: "api-gateway-service"

workload:
  service-url: http://localhost:8081/api/v1/trainers-workload

logging:
  level:
    org.springframework.boot.autoconfigure: WARN
    com.gym.crm.app.client.feign: DEBUG
    feign.Logger: DEBUG

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}:${spring.application.instance_id:${random.value}}
    hostname: ${spring.application.name}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL}

resilience4j:
  circuitbreaker:
    instances:
      workoutServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        eventConsumerBufferSize: 10