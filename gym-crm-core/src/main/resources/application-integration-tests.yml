spring:
  spring:
    application:
      name: "gym-crm-core"
  datasource:
    url: jdbc:postgresql://postgres:5432/gym-crm
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  activemq:
    broker-url: tcp://activemq:61616
    user: test
    password: test

jwt:
  secret: ${JWT_SECRET:test-key}

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    com.gcs.app: DEBUG

eureka:
  instance:
    instance-id: ${spring.application.name}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery:8761/eureka