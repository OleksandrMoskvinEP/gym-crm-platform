spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_crm_db
    driver-class-name: org.postgresql.Driver
    username: gym
    password: gym

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        hbm2ddl.auto: none

  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    packages:
      trust-all: true
  jms:
    client-id: core-service
    listener:
      auto-startup: true
      session:
        acknowledge-mode: auto

logging:
  level:
    root: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}