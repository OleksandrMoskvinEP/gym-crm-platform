version: "3.9"
services:
  mongo:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: gym
      MONGO_INITDB_ROOT_PASSWORD: gym
    ports:
      - "27017:27017"

  activemq:
    image: rmohr/activemq:latest

    ports:
      - "61616:61616"
      - "8161:8161"

    environment:
      ACTIVEMQ_USER: gym
      ACTIVEMQ_PASSWORD: gym
      ACTIVEMQ_MIN_MEMORY: 512
      ACTIVEMQ_MAX_MEMORY: 2048

  workload:
    image: gym-crm/workload:latest
    depends_on:
      - mongo
      - activemq
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://gym:gym@mongo:27017/gymcrm?authSource=gym
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: gym
      SPRING_ACTIVEMQ_PASSWORD: gym
