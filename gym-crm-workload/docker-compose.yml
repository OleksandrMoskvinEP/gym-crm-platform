version: "3.9"
services:
  mongo:
    image: mongo:6     # твой локальный образ
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"

  activemq:
    image: rmohr/activemq:latest   # твой локальный образ

    ports:
      - "61616:61616"
      - "8161:8161"   # web-консоль ActiveMQ

  workload:
    image: gym-crm/workload:latest  # твой локальный образ
    depends_on:
      - mongo
      - activemq
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin@mongo:27017/gymcrm?authSource=admin
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: admin
      SPRING_ACTIVEMQ_PASSWORD: admin
