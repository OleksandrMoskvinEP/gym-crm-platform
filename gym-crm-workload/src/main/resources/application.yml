server:
  port: 8082

spring:
  application:
    name: "trainers-workload-service"

  data:
    mongodb:
      host: localhost
      port: 27017
      database: gymcrm
      username: admin
      password: admin
      authentication-database: admin


  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    packages:
      trust-all: true
  jms:
    client-id: workload-service
    listener:
      auto-startup: true
      session:
        acknowledge-mode: auto

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

spring.web.resources:
  add-mappings: true
  static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.cloud: DEBUG
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: AnotherSecuredSecretKeyForWorkloadService123456

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always