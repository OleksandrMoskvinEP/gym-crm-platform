name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, discovery, workload, core]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gym-crm-${{ matrix.service }}/Dockerfile
          tags: gym-crm/${{ matrix.service }}:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  run-tests:
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run Maven tests
        run: mvn -B clean verify -DskipDocs=true -DskipSwaggerGeneration=true
